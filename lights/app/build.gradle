plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.homelights'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.homelights'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: the debug key, so a release build installs over a debug one.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the packet and config parsing, src/test.
    // org.json ships inside Android; the JVM tests need the same classes from Maven Central.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
